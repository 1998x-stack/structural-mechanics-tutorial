<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>课程目录</title>
    <link rel="stylesheet" href="theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(145deg, #f9fcf5 0%, #e8f3e8 100%);
            font-family: 'Segoe UI', 'PingFang SC', Roboto, 'Helvetica Neue', system-ui, -apple-system, sans-serif;
            padding: 2rem 1.5rem 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            display: block;
            max-width: 1400px;
            width: 100%;
            background: rgba(255, 255, 255, 0.70);
            backdrop-filter: blur(2px);
            border-radius: 48px 48px 32px 32px;
            padding: 2rem 2rem 1.5rem;
            box-shadow: 0 20px 40px rgba(90, 140, 100, 0.15), 0 8px 20px rgba(0, 30, 20, 0.08);
            border: 1px solid rgba(255, 245, 200, 0.5);
        }

        .header {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 2rem;
            border-bottom: 4px solid #f7d44a;
            padding-bottom: 0.75rem;
        }

        .header h1 {
            font-size: 2.4rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #2b7a4b, #3f9e6b);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            text-shadow: 0 2px 8px rgba(60, 140, 80, 0.12);
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .header h1 .emoji {
            font-size: 2.2rem;
            filter: drop-shadow(0 2px 4px rgba(255, 200, 50, 0.3));
        }

        .header .sub {
            font-size: 1rem;
            background: #fef7e0;
            padding: 0.3rem 1.2rem;
            border-radius: 40px;
            color: #3f6b4a;
            font-weight: 600;
            border: 1px solid #f3d98a;
            box-shadow: 0 2px 6px rgba(200, 160, 50, 0.1);
            white-space: nowrap;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.2rem;
            margin: 1.8rem 0 1.2rem;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            padding: 1rem 1.2rem 1rem 1.2rem;
            box-shadow: 0 6px 14px rgba(70, 120, 80, 0.08), 0 2px 6px rgba(0, 0, 0, 0.02);
            transition: all 0.2s ease;
            border: 1px solid rgba(210, 230, 200, 0.5);
            display: flex;
            flex-direction: column;
            position: relative;
            backdrop-filter: blur(2px);
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 14px 24px rgba(70, 140, 90, 0.15), 0 4px 12px rgba(40, 100, 60, 0.05);
            border-color: #b8d9b0;
            background: #fefefc;
        }

        .card-header {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            margin-bottom: 0.4rem;
            flex-wrap: wrap;
        }

        .chapter-num {
            font-size: 1.1rem;
            font-weight: 700;
            background: #f5d142;
            color: #2a5a3a;
            padding: 0 0.6rem;
            border-radius: 40px;
            line-height: 1.6;
            display: inline-block;
            box-shadow: inset 0 -2px 0 #dbb42c;
            letter-spacing: 0.3px;
            min-width: 2.2rem;
            text-align: center;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 650;
            color: #1f4d33;
            letter-spacing: -0.3px;
            line-height: 1.3;
            flex: 1;
        }

        .topic-list {
            list-style: none;
            margin-top: 0.3rem;
            padding-left: 0.2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.2rem 0.6rem;
        }

        .topic-list li {
            font-size: 0.8rem;
            color: #2d543a;
            background: #f1f9ee;
            padding: 0.1rem 0.7rem 0.2rem 1.2rem;
            border-radius: 30px;
            line-height: 1.6;
            position: relative;
            border: 1px solid #dcebd4;
            box-shadow: inset 0 1px 2px white;
        }

        .topic-list li::before {
            content: "⚡";
            position: absolute;
            left: 4px;
            top: 0px;
            font-size: 0.7rem;
            color: #e5b13b;
        }

        .card-footer {
            margin-top: 0.6rem;
            display: flex;
            justify-content: flex-end;
            border-top: 1px dashed #d4e8d0;
            padding-top: 0.5rem;
        }

        .card-footer a {
            background: #b7d8b0;
            color: #1f452b;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.85rem;
            padding: 0.2rem 1.2rem;
            border-radius: 40px;
            transition: 0.15s;
            border: 1px solid #8fb88a;
            box-shadow: 0 2px 4px rgba(60, 120, 60, 0.1);
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .card-footer a::after {
            content: "→";
            font-size: 1rem;
            transition: transform 0.1s;
        }

        .card-footer a:hover {
            background: #f7d44a;
            border-color: #dbb42c;
            color: #1f3d28;
            box-shadow: 0 4px 8px rgba(200, 160, 40, 0.2);
            transform: scale(1.02);
        }

        .card-footer a:active {
            transform: scale(0.96);
        }

        .footer {
            margin-top: 2.5rem;
            text-align: center;
            font-size: 1rem;
            color: #3b6b47;
            background: #f2fcee;
            padding: 0.8rem 2rem;
            border-radius: 60px;
            display: inline-block;
            border: 1px solid #c6dfbe;
            box-shadow: 0 2px 8px rgba(80, 130, 70, 0.08);
            font-weight: 500;
            letter-spacing: 0.3px;
            backdrop-filter: blur(2px);
        }

        .footer span {
            background: #f9eec1;
            padding: 0.1rem 0.8rem;
            border-radius: 30px;
            margin: 0 4px;
        }

        @media (max-width: 640px) {
            body { padding: 1rem 0.8rem; }
            .container { padding: 1.2rem 1rem; border-radius: 32px; }
            .header h1 { font-size: 1.8rem; }
            .header .sub { font-size: 0.75rem; padding: 0.2rem 0.8rem; }
            .course-grid { grid-template-columns: 1fr; gap: 1rem; }
            .card-title { font-size: 1.05rem; }
            .topic-list li { font-size: 0.7rem; }
        }

        @media (min-width: 768px) and (max-width: 1024px) {
            .course-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .container::before {
            content: "";
            display: block;
            height: 6px;
            width: 120px;
            background: linear-gradient(90deg, #f7d44a, #7fc47c, #4aa0b0, #f7b07a);
            border-radius: 10px;
            margin-bottom: 0.2rem;
        }

        .card:nth-child(6n+1) .chapter-num { background: #f7b07a; color: #3d2e1a; }
        .card:nth-child(6n+2) .chapter-num { background: #a7d4a0; color: #1f452b; }
        .card:nth-child(6n+3) .chapter-num { background: #f5d44a; color: #2f4d2a; }
        .card:nth-child(6n+4) .chapter-num { background: #b3d9e8; color: #1a3f4a; }
        .card:nth-child(6n+5) .chapter-num { background: #f7c6c6; color: #5a2e2e; }
        .card:nth-child(6n) .chapter-num { background: #c4b3e0; color: #2f2a4a; }

        .state-msg {
            text-align: center;
            padding: 3rem;
            color: #5f7f66;
            font-size: 1.1rem;
        }
        .state-msg.error {
            color: #b91c1c;
            background: #fef2f2;
            border-radius: 20px;
            margin: 1rem 0;
        }

        .skip-link {
            position: absolute;
            left: -9999px;
            top: 0;
            background: #1f4d33;
            color: #fff;
            padding: 0.5rem 1rem;
            border-radius: 0 0 12px 0;
            z-index: 10;
        }

        .skip-link:focus { left: 0; }

        main > h2 {
            color: #1f4d33;
            font-size: 1.4rem;
            margin: 1.6rem 0 0.6rem;
            border-left: 6px solid #f7d44a;
            padding-left: 0.7rem;
        }

        .intro-dek {
            font-size: 1rem;
            line-height: 1.8;
            color: #2d543a;
        }

        figure { margin: 1.4rem 0 0.4rem; }
        figure svg { display: block; width: 100%; height: auto; }
        figcaption {
            margin-top: 0.5rem;
            font-size: 0.85rem;
            color: #4b5563;
            line-height: 1.7;
            text-align: center;
        }
    </style>
</head>
<body>
<a class="skip-link" href="#content">跳转至正文</a>
<div class="container">
    <header class="header">
        <h1><span class="emoji"></span><span class="title-text"></span></h1>
        <div class="sub"></div>
    </header>

    <main id="content">
        <h2>先建立结构直觉</h2>
        <p class="intro-dek">整套课程从绪论出发，先把计算简图、支座与荷载的语言建立起来，再逐层走向静定、超静定、动力学与工程实战。每个章节都尽量用图示与算例把抽象的力学概念落到可检验的结论上。</p>
        <figure>
            <svg role="img" aria-labelledby="path-title path-desc" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
                <title id="path-title">结构力学学习路径</title>
                <desc id="path-desc">从计算简图与荷载出发，依次经过静定结构、超静定结构、结构动力学，最后到达工程实战与软件实现。</desc>
                <rect x="0" y="0" width="800" height="200" fill="#fffdf9"/>
                <line x1="60" y1="110" x2="740" y2="110" stroke="#cbd5e1" stroke-width="4"/>
                <g font-family="system-ui, 'PingFang SC', sans-serif" font-size="14" text-anchor="middle">
                    <circle cx="100" cy="110" r="30" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
                    <text x="100" y="106" fill="#1e3a8a">计算</text><text x="100" y="124" fill="#1e3a8a">简图</text>
                    <circle cx="280" cy="110" r="30" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
                    <text x="280" y="116" fill="#14532d">静定</text>
                    <circle cx="460" cy="110" r="30" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
                    <text x="460" y="116" fill="#78350f">超静定</text>
                    <circle cx="640" cy="110" r="30" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
                    <text x="640" y="116" fill="#3b0764">动力学</text>
                    <text x="100" y="168" fill="#64748b">第1–2章</text>
                    <text x="280" y="168" fill="#64748b">第3–7章</text>
                    <text x="460" y="168" fill="#64748b">第8–15章</text>
                    <text x="640" y="168" fill="#64748b">第19–27章</text>
                </g>
            </svg>
            <figcaption>学习路径示意：先能读懂与建立计算简图，再按“静定 → 超静定 → 动力 → 工程实战”的次序推进，前一步是后一步的前提。</figcaption>
        </figure>

        <h2>章节目录</h2>
        <nav id="cardContainer" class="course-grid" aria-label="章节目录"></nav>
    </main>

    <div style="text-align:center;">
        <div class="footer"></div>
    </div>
</div>

<script>
    (function() {
        var CHAPTERS = {
            title: '结构力学 · 从入门到精通',
            emoji: '🏗️',
            subtitle: '📘 28章 实战体系',
            chapterCount: 28,
            chapters: [
                { num: '01', title: '绪论', topics: ['研究对象与任务', '荷载分类', '结构分类', '计算简图'], file: '01.html' },
                { num: '02', title: '几何组成分析', topics: ['几何不变体系', '自由度与约束', '刚片规则', '瞬变体系'], file: '02.html' },
                { num: '03', title: '静定梁与刚架', topics: ['单跨静定梁', '多跨静定梁', '刚架内力图', '弯矩图技巧'], file: '03.html' },
                { num: '04', title: '静定桁架', topics: ['结点法', '截面法', '联合法', '零杆判别'], file: '04.html' },
                { num: '05', title: '三铰拱与悬索', topics: ['拱的受力特点', '合理拱轴线', '悬索结构', '推力计算'], file: '05.html' },
                { num: '06', title: '静定组合结构', topics: ['组合结构分类', '受力分析', '梁-桁混合结构', '内力计算'], file: '06.html' },
                { num: '07', title: '虚功原理与位移计算', topics: ['虚功原理', '单位荷载法', '图乘法', '温度与支座位移'], file: '07.html' },
                { num: '08', title: '力法（一）', topics: ['超静定次数', '力法基本方程', '基本体系', '力法计算步骤'], file: '08.html' },
                { num: '09', title: '力法（二）', topics: ['对称性利用', '温度变化', '支座移动', '位移校核'], file: '09.html' },
                { num: '10', title: '位移法（一）', topics: ['基本未知量', '转角位移方程', '基本体系', '无侧移刚架'], file: '10.html' },
                { num: '11', title: '位移法（二）', topics: ['对称性利用', '直接平衡法', '斜杆刚架', '力法位移法对比'], file: '11.html' },
                { num: '12', title: '力矩分配法', topics: ['转动刚度', '分配系数', '传递系数', '多结点分配'], file: '12.html' },
                { num: '13', title: '矩阵位移法（一）', topics: ['单元刚度矩阵', '坐标变换', '总刚集成', '局部坐标系'], file: '13.html' },
                { num: '14', title: '矩阵位移法（二）', topics: ['边界条件处理', '等效结点荷载', '算例分析', '编程思路'], file: '14.html' },
                { num: '15', title: '影响线', topics: ['静力法作影响线', '机动法作影响线', '最不利荷载位置', '最大内力计算'], file: '15.html' },
                { num: '16', title: '结构稳定性分析', topics: ['临界荷载', '欧拉公式', '压杆稳定', '边界条件影响'], file: '16.html' },
                { num: '17', title: '极限荷载与塑性分析', topics: ['极限弯矩', '塑性铰', '极限荷载计算', '塑性分析'], file: '17.html' },
                { num: '18', title: '工程结构案例', topics: ['桥梁受力分析', '厂房排架分析', '高层结构分析', '事故力学反思'], file: '18.html' },
                { num: '19', title: '结构动力学概论', topics: ['动力自由度', '单自由度自由振动', '阻尼振动', '自振频率'], file: '19.html' },
                { num: '20', title: '单自由度体系强迫振动', topics: ['简谐荷载', '杜哈梅积分', '共振分析', '隔振原理'], file: '20.html' },
                { num: '21', title: '多自由度体系振动', topics: ['振型分析', '自振频率计算', '振型正交性', '振型叠加法'], file: '21.html' },
                { num: '22', title: '能量原理与近似方法', topics: ['势能原理', '里兹法', '最小势能', '有限元思想'], file: '22.html' },
                { num: '23', title: '结构力学求解器', topics: ['求解器使用', '建模技巧', '结果验证', '手算对比'], file: '23.html' },
                { num: '24', title: 'SAP2000/ANSYS入门', topics: ['软件建模', '静力分析实战', '荷载组合', '结果后处理'], file: '24.html' },
                { num: '25', title: 'MATLAB结构编程', topics: ['矩阵位移法编程', '刚度矩阵生成', '动力学编程', '时程分析'], file: '25.html' },
                { num: '26', title: 'AI赋能结构分析', topics: ['知识图谱', '机器学习损伤识别', '拓扑优化', '趋势与局限'], file: '26.html' },
                { num: '27', title: '大跨与高层结构', topics: ['空间结构', '超高层体系', '抗风抗震', '结构控制'], file: '27.html' },
                { num: '28', title: '综合项目实战', topics: ['方案比选', '建模分析', '截面设计', '优化总结'], file: '28.html' }
            ]
        };
        var container = document.getElementById('cardContainer');
        var emojiEl = document.querySelector('.header .emoji');
        var titleEl = document.querySelector('.header .title-text');
        var subEl = document.querySelector('.header .sub');
        var footerEl = document.querySelector('.footer');

        function showError(msg) {
            container.innerHTML = '<div class="state-msg error">' + msg + '</div>';
        }

        Promise.resolve(CHAPTERS)
            .then(function(data) {
                document.title = data.title + ' · 课程目录';
                emojiEl.textContent = data.emoji;
                titleEl.textContent = data.title;
                subEl.textContent = data.subtitle;
                footerEl.innerHTML = '<span>' + data.chapterCount + '章</span> 实战体系 · 从入门到精通';

                if (!data.chapters || data.chapters.length === 0) {
                    showError('暂无课程数据');
                    return;
                }

                container.innerHTML = '';
                data.chapters.forEach(function(course) {
                    var card = document.createElement('div');
                    card.className = 'card';

                    var headerDiv = document.createElement('div');
                    headerDiv.className = 'card-header';

                    var numSpan = document.createElement('span');
                    numSpan.className = 'chapter-num';
                    numSpan.textContent = course.num;

                    var titleSpan = document.createElement('span');
                    titleSpan.className = 'card-title';
                    titleSpan.textContent = course.title;

                    headerDiv.appendChild(numSpan);
                    headerDiv.appendChild(titleSpan);
                    card.appendChild(headerDiv);

                    if (course.topics && course.topics.length > 0) {
                        var topicUl = document.createElement('ul');
                        topicUl.className = 'topic-list';
                        course.topics.forEach(function(topic) {
                            var li = document.createElement('li');
                            li.textContent = topic;
                            topicUl.appendChild(li);
                        });
                        card.appendChild(topicUl);
                    }

                    var footerDiv = document.createElement('div');
                    footerDiv.className = 'card-footer';
                    var link = document.createElement('a');
                    link.href = course.file;
                    link.textContent = '开始学习 ';
                    footerDiv.appendChild(link);
                    card.appendChild(footerDiv);

                    container.appendChild(card);
                });
            })
            .catch(function(err) {
                showError('课程数据加载失败: ' + err.message + '。请刷新页面重试。');
            });
    })();
</script>

<noscript>
    <div style="background:#fcf0d9; padding:1rem; border-radius:20px; text-align:center; color:#92400e;">
        请启用 JavaScript 以浏览课程目录。
    </div>
</noscript>
</body>
</html>
